name: contract-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract-tests:
    name: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Everything the tests call (stock, order, gateway, fake payment) runs in-process inside
      # this job. No network services are contacted. Skips, xfails, assert-free tests and
      # "no tests collected" all fail this step (see tests/conftest.py).
      - name: Run contract tests
        run: pytest -v
