name: contract-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract-tests:
    name: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Everything the tests call (stock, order, gateway, fake payment) runs in-process inside
      # this job. No network services are contacted. Skips, xfails, assert-free tests and
      # "no tests collected" all fail this step (see tests/conftest.py).
      - name: Run contract tests
        run: pytest -v

  # Builds the stock service image and tests the image itself (not the local process).
  # Separate from the required contract-tests check.
  stock-image:
    name: stock-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install test dependencies
        run: pip install -r requirements.txt

      - name: Build the stock service image
        run: docker build -f services/stock/Dockerfile -t stock-service:ci .

      # Step 1: the image as shipped, started from the real committed StockSnapshot, healthy,
      # with values checked against the hand calculation.
      - name: Real-snapshot run against the image
        env:
          STOCK_IMAGE: stock-service:ci
        run: pytest -v tests/contract/test_stock_snapshot.py

      # Step 2: the 28 stock contract tests, one fresh container per test, each seeded with its
      # own stock (race, refusals, expiry, idempotency).
      - name: Stock contract tests against the image
        env:
          STOCK_IMAGE: stock-service:ci
        run: pytest -v tests/contract/test_stock_contract.py

  # Builds the order and stock images and runs the image test for plan.md line 75
  # ("fail_saves never ships"). Separate from the required contract-tests check.
  order-image:
    name: order-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install test dependencies
        run: pip install -r requirements.txt

      - name: Build the stock and order images
        run: |
          docker build -f services/stock/Dockerfile -t stock-service:ci .
          docker build -f services/order/Dockerfile -t order-service:ci .

      - name: Order image refuses fail_saves and accepts an order when clean
        env:
          ORDER_IMAGE: order-service:ci
          STOCK_IMAGE: stock-service:ci
        run: pytest -v tests/image/test_order_image.py

  # SC-004: two oat milk lattes at once for the last Oatmilk.
  # Starts the real stack with docker compose (stock, order, gateway + fake payment), seeded with
  # tests/live/SampleStock.csv, and sends orders through the gateway over HTTP.
  # Separate from the required contract-tests check.
  race:
    name: race
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install test dependencies
        run: pip install -r requirements.txt

      - name: Start the stack
        env:
          STOCK_SEED: ./tests/live/SampleStock.csv
        run: docker compose --profile payment up -d --build --wait

      - name: "Two oat milk lattes at once: one accepted, one refused naming Oatmilk"
        run: pytest -v -rA tests/live/test_concurrent_oat_milk.py

      - name: Service logs
        if: failure()
        run: docker compose --profile payment logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose --profile payment down

  # SC-001: all 40 sample orders, expected vs actual in the job summary.
  # Starts the real stack with docker compose (stock, order, gateway + fake payment), seeded with
  # tests/live/SampleStock.csv, and sends orders through the gateway over HTTP.
  # Separate from the required contract-tests check.
  replay:
    name: replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install test dependencies
        run: pip install -r requirements.txt

      - name: Start the stack
        env:
          STOCK_SEED: ./tests/live/SampleStock.csv
        run: docker compose --profile payment up -d --build --wait

      - name: All 40 sample orders through the gateway
        env:
          REPLAY_REPORT: replay.md
        run: pytest -v -rf tests/live/test_sample_orders_live.py

      - name: Expected vs actual per order
        if: success() || failure()
        run: |
          { echo "| order | expected | actual | match |"; echo "|---|---|---|---|"; cat replay.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Service logs
        if: failure()
        run: docker compose --profile payment logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose --profile payment down
